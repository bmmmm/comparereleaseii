name: action-test

# Validates the composite action's mechanics without any secret: the CLI runs
# from the action checkout, writes the step summary, uploads the artifact and
# exposes its outputs. The judged red/green discrimination (green on real
# notes, red on the fabricated fixture) is validated locally — see
# docs/watchdog.md for the fabricated-control recipe.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-test.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - .github/workflows/action-test.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./
        with:
          repo: restic/restic
          tag: v0.19.1
          engine: "off"
          artifact-name: smoke-report
      - name: Assert outputs
        env:
          CODE: ${{ steps.check.outputs.exit-code }}
          SCORE: ${{ steps.check.outputs.score }}
        run: |
          echo "exit-code=$CODE score=$SCORE"
          [ "$CODE" = "0" ] && [ -n "$SCORE" ]

  # The `repo` path above never leaves GitHub, so it cannot catch a broken
  # `repo-url`: that one builds different arguments, skips the event-tag
  # default and reads its notes from the forge's own API.
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./
        with:
          repo-url: https://gitea.com/gitea/tea.git
          tag: v0.14.2
          engine: "off"
          # This job asserts the plumbing — arguments, clone, notes, outputs.
          # Under the default gate the verdict on someone else's release
          # decides the job, so the run would go red for a reason that has
          # nothing to do with the action and would move when they edit notes.
          fail-on: none
          artifact-name: smoke-report-forge
      - name: Assert outputs
        env:
          CODE: ${{ steps.check.outputs.exit-code }}
          SCORE: ${{ steps.check.outputs.score }}
        run: |
          echo "exit-code=$CODE score=$SCORE"
          [ "$CODE" = "0" ] && [ -n "$SCORE" ]

  # `repo` carries a default, so passing both is a real mistake a user can
  # make silently; the action must refuse it rather than pick one.
  conflicting-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        continue-on-error: true
        uses: ./
        with:
          repo: restic/restic
          repo-url: https://gitea.com/gitea/tea.git
          engine: "off"
      - name: The action must have failed
        run: |
          [ "${{ steps.check.outcome }}" = "failure" ]
