name: mutation-tests

# The mutation harness (scripts/mutate.ts) runs the full suite once per
# guard — dozens of serial suite runs — too slow for every push. Nightly
# catches a surviving mutant before a PR does; dispatch covers "run it now".
# Keyless like every workflow here: the harness is deterministic, no judge.
on:
  schedule:
    - cron: "14 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# GitHub disables cron schedules after 60 days without repo activity; this
# repo's GitHub mirror receives every push, so the clock keeps resetting.
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutate
