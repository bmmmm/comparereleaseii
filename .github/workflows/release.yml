name: release

# Publishes to npm with provenance when a GitHub release is published.
# Needs the NPM_TOKEN repo secret (npm automation token, publish scope).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  # Dogfood gate: our own release notes must score >= 90 with our own checker.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check our own release notes with our own checker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node src/cli.ts --local . --head "$GITHUB_REF_NAME" --engine api \
            --fail-on contradicted --json report.json --md report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          jq -e '.metrics.scores.overall >= 90' report.json

  publish:
    needs: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches package.json
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version ($pkg) != release tag ($tag) — bump package.json first." >&2
            exit 1
          fi
      # prepublishOnly runs pnpm check + pnpm test, prepack builds dist/.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
