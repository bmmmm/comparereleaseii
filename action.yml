name: comparerelease
description: >-
  Fact-check release notes against the actual code diff — this repository, or
  any forge reachable by clone (Forgejo, Gitea, GitLab). Writes the report to
  the step summary, uploads the HTML report as an artifact, and fails the job
  when claims are unsupported or contradicted.
author: bmmmm
branding:
  icon: check-circle
  color: green

inputs:
  repo:
    description: "owner/repo to check on GitHub (default: the current repository)"
    default: ""
  repo-url:
    description: >-
      Clone URL of a repository on any other forge (Forgejo, Gitea, GitLab, a
      plain git host). Mutually exclusive with `repo`. Notes come from the
      forge's release API when it answers, else the CHANGELOG section.
    default: ""
  tag:
    description: >-
      Release tag to check (default: the tag of the triggering release event,
      else the latest release)
    default: ""
  base:
    description: "Base tag/ref to diff against (default: previous release)"
    default: ""
  engine:
    description: "Judge engine: api | openai | off"
    default: "api"
  model:
    description: "Judge model (default: haiku for the api engine)"
    default: ""
  fail-on:
    description: "none | contradicted | no-evidence"
    default: "no-evidence"
  notes-file:
    description: "Check this notes file (workspace-relative) instead of the published notes"
    default: ""
  anthropic-api-key:
    description: "Anthropic API key for the api engine"
    default: ""
  github-token:
    description: "Token for gh API calls (and the release comment)"
    default: ${{ github.token }}
  forgejo-token:
    description: "Token for the Forgejo/Gitea release API when `repo-url` points at a private repo"
    default: ""
  gitlab-token:
    description: "Token for the GitLab release API when `repo-url` points at a private project"
    default: ""
  comment:
    description: >-
      true: append/update the verdict summary in the body of this repository's
      triggering release (needs contents: write). Ignored with `repo-url` — the
      verdict is about a repository elsewhere.
    default: "false"
  artifact-name:
    description: "Name of the uploaded report artifact"
    default: "comparerelease-report"

outputs:
  score:
    description: "Overall trust score (0-100)"
    value: ${{ steps.run.outputs.score }}
  exit-code:
    description: "CLI exit code: 0 pass, 1 unsupported/contradicted claims, 2 usage/data error"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        FORGEJO_TOKEN: ${{ inputs.forgejo-token }}
        GITLAB_TOKEN: ${{ inputs.gitlab-token }}
        IN_REPO: ${{ inputs.repo }}
        IN_REPO_URL: ${{ inputs.repo-url }}
        IN_TAG: ${{ inputs.tag }}
        IN_BASE: ${{ inputs.base }}
        IN_ENGINE: ${{ inputs.engine }}
        IN_MODEL: ${{ inputs.model }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_NOTES_FILE: ${{ inputs.notes-file }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
      run: |
        set +e
        out="$(mktemp -d "$RUNNER_TEMP/comparerelease.XXXXXX")"
        # `repo` defaults to this repository, so it is never empty and cannot
        # be compared against `repo-url` after the fact — decide first.
        if [ -n "$IN_REPO_URL" ]; then
          if [ -n "$IN_REPO" ]; then
            echo "::error::repo and repo-url both name the repository — set only one."
            exit 2
          fi
          args=( --repo-url "$IN_REPO_URL" )
          # EVENT_TAG belongs to a release of *this* repository; on another
          # forge that tag usually does not exist, so it must not be a default.
          tag="$IN_TAG"
        else
          args=( "${IN_REPO:-$GITHUB_REPOSITORY}" )
          tag="${IN_TAG:-$EVENT_TAG}"
        fi
        [ -n "$tag" ] && args+=( --tag "$tag" )
        [ -n "$IN_BASE" ] && args+=( --base "$IN_BASE" )
        [ -n "$IN_NOTES_FILE" ] && args+=( --notes-file "$IN_NOTES_FILE" )
        [ -n "$IN_MODEL" ] && args+=( --model "$IN_MODEL" )
        args+=( --engine "$IN_ENGINE" --fail-on "$IN_FAIL_ON" )
        args+=( --md "$out/report.md" --json "$out/report.json" --html "$out/report.html" )
        node "$GITHUB_ACTION_PATH/bin/comparerelease.mjs" "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report-dir=$out" >> "$GITHUB_OUTPUT"
        [ -f "$out/report.md" ] && cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
        [ -f "$out/report.json" ] && echo "score=$(jq -r '.metrics.scores.overall' "$out/report.json")" >> "$GITHUB_OUTPUT"
        exit 0

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.report-dir }}/report.html
        if-no-files-found: ignore

    - name: Update the release body with the verdict
      if: ${{ inputs.comment == 'true' && github.event.release.id && inputs.repo-url == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_ID: ${{ github.event.release.id }}
        REPORT_DIR: ${{ steps.run.outputs.report-dir }}
      run: |
        json="$REPORT_DIR/report.json"
        [ -f "$json" ] || exit 0
        score="$(jq -r '.metrics.scores.overall' "$json")"
        label="$(jq -r '.metrics.scores.label' "$json")"
        counts="$(jq -r '[.results[].verdict] | "\(map(select(.=="verified"))|length) verified, \(map(select(.=="partial"))|length) partial, \(map(select(.=="no-evidence"))|length) no-evidence, \(map(select(.=="contradicted"))|length) contradicted"' "$json")"
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        body="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)"
        stripped="$(printf '%s\n' "$body" | awk '/<!-- comparerelease:start -->/{skip=1;next} /<!-- comparerelease:end -->/{skip=0;next} !skip{print}')"
        new="$(printf '%s\n\n<!-- comparerelease:start -->\n**Release-note fact check:** trust score %s/100 (%s) — %s · [full report](%s)\n<!-- comparerelease:end -->' "$stripped" "$score" "$label" "$counts" "$run_url")"
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f body="$new" > /dev/null

    - name: Fail on the CLI exit code
      if: ${{ steps.run.outputs.exit-code != '0' }}
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CODE"
